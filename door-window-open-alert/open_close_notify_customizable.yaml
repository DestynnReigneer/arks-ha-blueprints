blueprint:
  name: Customizable Door/Window Open Alert
  description: >-
    Sends a configurable, actionable notification if a door or window is left
    open too long. Three buttons, always in the same positions regardless of
    what you label them: left = Ignore (stops nagging for good), center =
    Close the device (or a fallback Snooze if nothing can close it), right =
    Snooze. Whenever an alert gets zero response, it re-sends and keeps
    repeating until it's resolved - marked Urgent on your chosen interval if
    you set one, or on a plain default interval if you don't.
  domain: automation
  source_url: https://raw.githubusercontent.com/DestynnReigneer/arks-ha-blueprints/main/door-window-open-alert/open_close_notify_customizable.yaml

  input:
    sensor_to_monitor:
      name: Sensor to Monitor
      description: "The sensor entity to monitor. Example: a garage door, mailbox, safe, or interior door sensor."
      selector:
        entity:
          domain: binary_sensor
          multiple: false

    friendly_device_name:
      name: Friendly Name (Optional)
      description: >-
        Optional. Overrides the name shown in notifications, in case the
        sensor's Home Assistant name isn't what you'd actually call it.
        Example: your sensor might be named "Master Door contact sensor" in
        HA, but you'd rather notifications say "Master Bedroom Door."
      selector:
        text:
          multiline: false
      default: ""

    initial_trigger_time_minutes:
      name: Initial Alert Time (minutes)
      description: >-
        The number of minutes the sensor must be on before the first alert is
        sent. Example: 15 for a garage door, 5 for a mailbox.
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: "minutes"
          mode: box

    notification_devices:
      name: Notification Devices
      description: The devices that will receive the alert notification.
      selector:
        device:
          integration: mobile_app
          multiple: true

    closable_device:
      name: Closable Device (Optional)
      description: >-
        Leave this empty for anything a person has to check in person - an
        interior door, a safe, a vault, a hinged door with no auto-closer.
        Only fill it in when there's an actual device that can close it for
        you, like a smart garage door opener or a smart lock's cover/switch
        entity. When set, the center button closes it automatically and
        confirms once the sensor agrees it's shut. When empty, the center
        button becomes a second Snooze instead, since there's nothing it can
        actually close.
      selector:
        entity:
          domain: cover
          multiple: false
      default: ""

    initial_notification_message:
      name: Initial Notification Message
      description: >-
        The message for the first notification. Example: "The garage door
        has been open for too long."
      selector:
        text:
          multiline: true
      default: "This has been left open for too long."

    # Right-hand button: always Snooze.
    option_1_title:
      name: Snooze Button Title (Right)
      description: >-
        Text for the right-hand Snooze button. The delay you set below is
        appended automatically, so "Snooze" becomes "Snooze (30)" on the
        actual button - no need to type the number yourself.
      selector:
        text:
          multiline: false
      default: "Snooze"

    option_1_delay_minutes:
      name: Snooze Delay - Right Button (minutes)
      description: "How long this snooze lasts before re-checking. Example: 30."
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: "minutes"
          mode: box

    # Center button: Close the device if one's configured, otherwise a
    # second, independent Snooze.
    option_2_title_closable:
      name: Center Button Title (If Closable Device Is Set)
      description: >-
        Optional. Leave blank and it auto-generates "Close <device name>"
        from the device you picked above. Only fill this in if you want
        different wording, e.g. "Shut Garage".
      selector:
        text:
          multiline: false
      default: ""

    option_2_title_non_closable:
      name: Center Button Title (Fallback Snooze, No Device)
      description: >-
        Text for the center button when no closable device is configured -
        it's just a second Snooze at that point, with its own delay below.
        Same auto-append behavior as the right-hand Snooze.
      selector:
        text:
          multiline: false
      default: "Snooze"

    option_2_fallback_delay_minutes:
      name: Snooze Delay - Center Button Fallback (minutes)
      description: >-
        How long this snooze lasts before re-checking, when the center
        button is acting as a fallback Snooze (no closable device
        configured). Independent from the right-hand Snooze's delay.
        Example: 90.
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: "minutes"
          mode: box

    urgent_recheck_delay_minutes:
      name: Urgent Recheck Delay (minutes)
      description: >-
        Leave at 0 to turn the Urgent concept off entirely - nagging still
        continues on the Standard Nag Delay below, just without the Urgent
        relabeling. Set a real value to turn it on: whenever an alert gets
        zero response (either the very first alert, or any snooze whose
        timer ran out with the sensor still open), it re-sends marked
        Urgent and keeps repeating on this interval until resolved. An
        active response (any button) always resets back to normal.
        Example: 10.
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: "minutes"
          mode: box
      default: 0

    standard_nag_delay_minutes:
      name: Standard Nag Delay (minutes)
      description: >-
        How often to keep re-sending the alert (titled normally, not
        Urgent) whenever it gets zero response and Urgent Recheck Delay is
        left at 0. Also used for the very first alert's own wait, before
        anyone's responded to anything yet. Example: 15.
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: "minutes"
          mode: box
      default: 15

    urgent_prefix_text:
      name: Urgent Prefix Text
      description: >-
        Used as the title when re-sending an alert that got no response at
        all, if Urgent Recheck Delay is set above 0. Example: "Urgent -
        still open!".
      selector:
        text:
          multiline: false
      default: "Urgent"

    # Custom messages for the closable-device auto-close path.
    confirmation_message_text:
      name: Confirmation Message (Optional)
      description: >-
        Sent whenever the sensor is confirmed closed - whether a person
        closed it by hand or the Closable Device closed it - and the
        automation then stops. Never sent optimistically; the sensor has to
        actually report closed first. Leave blank for a generated default.
        Use '{person}' for whoever pressed the button, if anyone did. A
        timestamp is appended automatically either way.
      selector:
        text:
          multiline: true
      default: ""

    failure_message_text:
      name: Closing Failure Message (Optional)
      description: >-
        Optional. Sent every 5 minutes while the device was told to close
        but the sensor still shows open. Leave blank for the default:
        "<device> was told to close, but the sensor still shows open -
        please check it." Use '{person}' to insert whoever pressed Close.
        A timestamp is appended automatically either way.
      selector:
        text:
          multiline: true
      default: ""

mode: restart

trigger:
  - platform: state
    entity_id: !input sensor_to_monitor
    to: 'on'
    for:
      minutes: !input initial_trigger_time_minutes

variables:
  # Bind every input that's needed inside a computed template to a plain
  # variable first. There is no runtime input() template function in Home
  # Assistant - !input only works as a direct structural substitution, so
  # anything used inside a {{ }} expression has to go through a variable
  # like this instead.
  sensor_to_monitor: !input sensor_to_monitor
  friendly_device_name: !input friendly_device_name
  closable_device: !input closable_device
  initial_notification_message: !input initial_notification_message
  option_1_title_raw: !input option_1_title
  option_1_delay_minutes: !input option_1_delay_minutes
  option_2_title_closable: !input option_2_title_closable
  option_2_title_non_closable: !input option_2_title_non_closable
  option_2_fallback_delay_minutes: !input option_2_fallback_delay_minutes
  urgent_recheck_delay_minutes: !input urgent_recheck_delay_minutes
  standard_nag_delay_minutes: !input standard_nag_delay_minutes
  urgent_prefix_text: !input urgent_prefix_text
  confirmation_message_text: !input confirmation_message_text
  failure_message_text: !input failure_message_text

  notification_id: "alert_{{ trigger.entity_id.split('.')[1] }}_{{ now().timestamp() | int }}"
  sensor_name: >-
    {{ friendly_device_name or state_attr(sensor_to_monitor, 'friendly_name') or sensor_to_monitor }}
  has_closable_device: "{{ closable_device not in [none, ''] }}"
  closable_device_name: >-
    {{ (device_attr(device_id(closable_device), 'name') or 'the device') if has_closable_device else '' }}
  option_1_button_title: "{{ (option_1_title_raw or 'Snooze') }} ({{ option_1_delay_minutes }})"
  option_2_fallback_button_title: "{{ (option_2_title_non_closable or 'Snooze') }} ({{ option_2_fallback_delay_minutes }})"
  option_2_title: >-
    {{ (option_2_title_closable or ('Close ' ~ closable_device_name)) if has_closable_device else option_2_fallback_button_title }}

  # Whenever an alert gets zero response - the very first one, or any
  # snooze whose timer ran out with the sensor still open - it escalates to
  # this same title/delay. Urgent only if a real recheck delay was set;
  # otherwise it stays a plain, repeating nag on the standard interval.
  urgent_enabled: "{{ urgent_recheck_delay_minutes | int(0) > 0 }}"
  escalated_title: "{{ urgent_prefix_text if urgent_enabled else 'Alert' }}"
  escalated_delay_minutes: "{{ urgent_recheck_delay_minutes if urgent_enabled else standard_nag_delay_minutes }}"

  alert_title: "Alert"
  # Nobody has had a chance to respond yet, so the very first wait uses the
  # same escalation delay a no-response timeout would use later.
  resend_delay_minutes: "{{ escalated_delay_minutes }}"


action:
  - repeat:
      while: "{{ states(sensor_to_monitor) == 'on' }}"
      sequence:
        # Send (or re-send) the actionable alert to every selected device.
        # Button order is fixed: left = Ignore, center = Close/fallback
        # Snooze, right = Snooze - regardless of what each is labeled, so
        # the position itself is always predictable.
        - repeat:
            for_each: !input notification_devices
            sequence:
              - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                data:
                  title: "{{ alert_title }} - {{ sensor_name }}"
                  message: "{{ initial_notification_message }} @ {{ now().strftime('%H:%M') }}"
                  data:
                    actions:
                      - action: "ignore"
                        title: "Ignore"
                      - action: "close"
                        title: "{{ option_2_title }}"
                      - action: "wait_1"
                        title: "{{ option_1_button_title }}"
                    tag: "{{ notification_id }}"

        # Wait for a button press OR for the sensor to close on its own.
        # Including the state trigger means a manual close ends the alert
        # immediately instead of sitting until the next timeout.
        - wait_for_trigger:
            - platform: event
              event_type: mobile_app_notification_action
              event_data:
                action: "ignore"
                tag: "{{ notification_id }}"
            - platform: event
              event_type: mobile_app_notification_action
              event_data:
                action: "close"
                tag: "{{ notification_id }}"
            - platform: event
              event_type: mobile_app_notification_action
              event_data:
                action: "wait_1"
                tag: "{{ notification_id }}"
            - platform: state
              entity_id: !input sensor_to_monitor
              to: 'off'
          timeout:
            minutes: "{{ resend_delay_minutes }}"
          continue_on_timeout: true

        - variables:
            # Who pressed the button. Prefer the actual Home Assistant person
            # linked to the account that tapped it; fall back to the device's
            # name, then to a generic word. Empty when no button was pressed
            # (a timeout, or the sensor closing on its own).
            responder_is_button: "{{ wait.trigger is not none and (wait.trigger.platform | default('')) == 'event' }}"
            responder_user_id: >-
              {{ wait.trigger.event.context.user_id if responder_is_button else none }}
            responder_person: >-
              {{ (states.person
                  | selectattr('attributes.user_id', 'defined')
                  | selectattr('attributes.user_id', 'eq', responder_user_id)
                  | map(attribute='name') | list | first | default(none, true))
                 if responder_user_id else none }}
            responder_name: >-
              {{ (responder_person
                  or device_attr(wait.trigger.event.data.device_id, 'name')
                  or 'Someone') if responder_is_button else '' }}

        - choose:
            # --- Already resolved. Checked FIRST, before acting on any
            # button, so a tap that lands moments after it closed can't
            # re-open a toggle or start a pointless snooze. Deliberately
            # does nothing here - the loop's own condition ends it, and the
            # single closed-handler after the loop sends the message.
            - conditions: "{{ states(sensor_to_monitor) == 'off' }}"
              sequence: []

            # --- Ignore: stop nagging entirely.
            - conditions: "{{ responder_is_button and wait.trigger.event.data.action == 'ignore' }}"
              sequence:
                - repeat:
                    for_each: !input notification_devices
                    sequence:
                      - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                        data:
                          message: "clear_notification"
                          data:
                            tag: "{{ notification_id }}"
                - repeat:
                    for_each: !input notification_devices
                    sequence:
                      - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                        data:
                          message: >-
                            {{ responder_name }} chose to ignore this - no more reminders will be sent @ {{ now().strftime('%H:%M') }}
                          data:
                            tag: "{{ notification_id }}_status"
                - stop: "Ignored by user"

            # --- Right button: Snooze. A one-time quiet period that also
            # ends early if the sensor closes during it.
            - conditions: "{{ responder_is_button and wait.trigger.event.data.action == 'wait_1' }}"
              sequence:
                - repeat:
                    for_each: !input notification_devices
                    sequence:
                      - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                        data:
                          message: "clear_notification"
                          data:
                            tag: "{{ notification_id }}"
                - repeat:
                    for_each: !input notification_devices
                    sequence:
                      - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                        data:
                          message: >-
                            {{ responder_name }} snoozed this alert for {{ option_1_delay_minutes }} minutes @ {{ now().strftime('%H:%M') }}
                          data:
                            tag: "{{ notification_id }}_status"
                - wait_for_trigger:
                    - platform: state
                      entity_id: !input sensor_to_monitor
                      to: 'off'
                  timeout:
                    minutes: !input option_1_delay_minutes
                  continue_on_timeout: true
                - variables:
                    alert_title: "{{ escalated_title }}"
                    resend_delay_minutes: "{{ escalated_delay_minutes }}"

            # --- Center button: Close, or fallback Snooze
            - conditions: "{{ responder_is_button and wait.trigger.event.data.action == 'close' }}"
              sequence:
                - choose:
                    # Scenario 2a: No Closable Device configured - this is
                    # just a second Snooze with its own delay.
                    - conditions: "{{ not has_closable_device }}"
                      sequence:
                        - repeat:
                            for_each: !input notification_devices
                            sequence:
                              - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                data:
                                  message: "clear_notification"
                                  data:
                                    tag: "{{ notification_id }}"
                        - repeat:
                            for_each: !input notification_devices
                            sequence:
                              - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                data:
                                  message: >-
                                    {{ responder_name }} snoozed this alert for {{ option_2_fallback_delay_minutes }} minutes @ {{ now().strftime('%H:%M') }}
                                  data:
                                    tag: "{{ notification_id }}_status"
                        - wait_for_trigger:
                            - platform: state
                              entity_id: !input sensor_to_monitor
                              to: 'off'
                          timeout:
                            minutes: !input option_2_fallback_delay_minutes
                          continue_on_timeout: true
                        - variables:
                            alert_title: "{{ escalated_title }}"
                            resend_delay_minutes: "{{ escalated_delay_minutes }}"

                    # Scenario 2b: Closable Device IS configured. Never claim
                    # success optimistically - only send the confirmation once
                    # the sensor itself agrees it's closed.
                    - conditions: "{{ has_closable_device }}"
                      sequence:
                        - service: cover.close_cover
                          target:
                            entity_id: "{{ closable_device }}"
                        - wait_for_trigger:
                            - platform: state
                              entity_id: !input sensor_to_monitor
                              to: 'off'
                          timeout:
                            minutes: 1
                          continue_on_timeout: true
                        - if: "{{ states(sensor_to_monitor) == 'off' }}"
                          then:
                            - repeat:
                                for_each: !input notification_devices
                                sequence:
                                  - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                    data:
                                      title: "Closed - {{ sensor_name }}"
                                      message: >-
                                        {{ (confirmation_message_text or (closable_device_name ~ ' closed automatically, requested by {person}')) | replace('{person}', responder_name or 'someone') }} @ {{ now().strftime('%H:%M') }}
                                      data:
                                        tag: "{{ notification_id }}_status"
                            - stop: "Closed automatically"
                          else:
                            - repeat:
                                until: "{{ states(sensor_to_monitor) == 'off' }}"
                                sequence:
                                  - repeat:
                                      for_each: !input notification_devices
                                      sequence:
                                        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                          data:
                                            title: "Alert"
                                            message: >-
                                              {{ (failure_message_text or (closable_device_name ~ ' was told to close (requested by {person}), but the sensor still shows open - please check it')) | replace('{person}', responder_name or 'someone') }} @ {{ now().strftime('%H:%M') }}
                                            data:
                                              tag: "{{ notification_id }}_status"
                                  - wait_for_trigger:
                                      - platform: state
                                        entity_id: !input sensor_to_monitor
                                        to: 'off'
                                    timeout:
                                      minutes: 5
                                    continue_on_timeout: true
                            - repeat:
                                for_each: !input notification_devices
                                sequence:
                                  - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                    data:
                                      title: "Closed - {{ sensor_name }}"
                                      message: >-
                                        {{ (confirmation_message_text or (closable_device_name ~ ' closed automatically, requested by {person}')) | replace('{person}', responder_name or 'someone') }} @ {{ now().strftime('%H:%M') }}
                                      data:
                                        tag: "{{ notification_id }}_status"
                            - stop: "Closed after retries"

            # --- Timeout: nobody responded at all. Escalate exactly like a
            # snooze's timer running out.
            - conditions: "{{ wait.trigger is none }}"
              sequence:
                - variables:
                    alert_title: "{{ escalated_title }}"
                    resend_delay_minutes: "{{ escalated_delay_minutes }}"

  # Reaching here means the loop's condition went false - the sensor closed.
  # Every other ending (Ignore, auto-close) stops the run outright, so this
  # is the one place that reports a close, no matter which path got here:
  # closed during the first wait, during a snooze, or between nags.
  - repeat:
      for_each: !input notification_devices
      sequence:
        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: "clear_notification"
            data:
              tag: "{{ notification_id }}"
  - repeat:
      for_each: !input notification_devices
      sequence:
        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            title: "Closed - {{ sensor_name }}"
            message: >-
              {{ (confirmation_message_text or (sensor_name ~ ' is now closed')) | replace('{person}', responder_name | default('someone', true)) }} @ {{ now().strftime('%H:%M') }}
            data:
              tag: "{{ notification_id }}_status"
